<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7/7/2026</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="vignette"></div>
    <div class="grain"></div>
    <main class="copy" aria-label="A garden made for you">
      <p class="eyebrow">Esto es</p>
      <h1>Para La Mejor<br />Casualidad</h1>
      <div class="rule"><i></i><span>✦</span><i></i></div>
    </main>
    <div class="hint">move gently</div>
    <audio id="background-music" src="musica.mp3" loop preload="auto"></audio>
    <div class="music-controls">
      <button class="music-control" id="music-control" type="button" aria-label="Reproducir música" aria-pressed="false">
        <span aria-hidden="true">♪</span> <span id="music-label">Reproducir música</span>
      </button>
      <button class="music-control" id="next-track-control" type="button" aria-label="Siguiente canción">
        <span aria-hidden="true">⏭</span> Siguiente
      </button>
    </div>
    <script src="music.js"></script>
    <canvas id="garden"></canvas>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
